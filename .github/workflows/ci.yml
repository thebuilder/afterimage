name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  shaders:
    # Validates all 30 WGSL files with `vgpu check`. A stock ubuntu runner has
    # no GPU adapter, so the software renderer is installed first; without it
    # vgpu skips device validation and every shader reports NOT VALIDATED.
    # The doctor line exists so a future failure explains itself in the log.
    # Informational until observed green on GitHub: to promote it to a
    # required gate, delete the continue-on-error line after a green run.
    name: WGSL validation (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vgpu install-software-renderer
      - run: npx vgpu doctor --pretty || true
      - run: npm run check:wgsl

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:registry
      - run: npm run lint
      - run: npm run build

  shaders:
    # Validates all 30 WGSL files with `vgpu check` on the software renderer,
    # observed green on ubuntu-latest and therefore a required gate. The
    # doctor line exists so a future failure explains itself in the log.
    name: WGSL validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vgpu install-software-renderer
      - run: npx vgpu doctor --pretty || true
      - run: npm run check:wgsl
        env:
          # "auto" silently degrades to parse-only when no device can be
          # acquired; require turns that into a hard failure, which is the
          # only honest mode for a required gate.
          VGPU_VALIDATE: require

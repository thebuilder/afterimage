<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Afterimage | Live visual experiments</title>
    <meta name="description" content="A collection of interactive visual experiments rendered live in your browser. Choose an effect, adjust the controls, or hide the interface and let it fill the screen." />

    <!-- __SITE_URL__ is filled in at build time by the site-url plugin in
         vite.config.ts. It resolves to the deployment's own origin, and to an
         empty string locally, which leaves these as relative paths. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Afterimage" />
    <meta property="og:title" content="Afterimage" />
    <meta property="og:description" content="Live visual experiments, rendered in your browser." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Afterimage wordmark over a field of glowing particle filaments." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Afterimage" />
    <meta name="twitter:description" content="Live visual experiments, rendered in your browser." />
    <meta name="twitter:image" content="__SITE_URL__/og.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap"
    />
    <title>Afterimage | One live experiment at a time</title>
    <meta name="description" content="Interactive visual experiments rendered live in your browser, one at a time, with a new one most days. Shape it with the controls, or hide the interface and let it fill the screen." />

    <!-- The __PLACEHOLDERS__ are filled in at build time by the plugins in
         vite.config.ts. __SITE_URL__ is the deployment's own origin (empty
         locally, which leaves relative paths). The __OG_*__ values describe the
         newest effect, read from public/og.json, which `npm run og` writes
         alongside the card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Afterimage" />
    <meta property="og:title" content="__OG_TITLE__" />
    <meta property="og:description" content="__OG_DESCRIPTION__" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og.jpg?v=__OG_VERSION__" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="__OG_ALT__" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__OG_TITLE__" />
    <meta name="twitter:description" content="__OG_DESCRIPTION__" />
    <meta name="twitter:image" content="__SITE_URL__/og.jpg?v=__OG_VERSION__" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
